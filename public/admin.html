<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Anukool</title>
  <meta name="robots" content="noindex, nofollow" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:     #02050e;
      --bg2:    #061020;
      --bg3:    #0a1628;
      --card:   rgba(10,22,40,0.9);
      --border: rgba(255,255,255,0.08);
      --teal:   #4ecdc4;
      --accent: #7c6aff;
      --amber:  #e8a87c;
      --text:   #f0f4f8;
      --muted:  rgba(240,244,248,0.5);
      --red:    #ff5f5f;
      --green:  #4ec94e;
    }
    html, body { height: 100%; }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    /* ── LOGIN ── */
    #login-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
    }

    .login-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2.5rem;
      width: 100%;
      max-width: 380px;
      backdrop-filter: blur(20px);
      text-align: center;
    }

    .login-logo { font-size: 2rem; margin-bottom: 0.5rem; }
    .login-box h1 { font-size: 1.4rem; font-weight: 700; margin-bottom: 0.4rem; }
    .login-box p { color: var(--muted); font-size: 0.875rem; margin-bottom: 2rem; }

    .form-group { text-align: left; margin-bottom: 1.25rem; }
    .form-group label { display: block; font-size: 0.8rem; font-weight: 600; color: var(--muted); margin-bottom: 0.4rem; letter-spacing: 0.5px; }
    .form-group input, .form-group textarea, .form-group select {
      width: 100%;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 11px 14px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.9rem;
      transition: border-color 0.2s;
      outline: none;
    }

    .form-group input:focus, .form-group textarea:focus, .form-group select:focus { border-color: rgba(78,205,196,0.4); }

    .form-group input[type="password"] { font-family: 'Fira Code', monospace; letter-spacing: 2px; }

    .btn { display: inline-flex; align-items: center; gap: 7px; padding: 11px 22px; border-radius: 9px; font-size: 0.875rem; font-weight: 600; border: none; cursor: pointer; transition: all 0.2s; font-family: inherit; text-decoration: none; }
    .btn-primary { background: linear-gradient(135deg, var(--teal), var(--accent)); color: #02050e; }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(78,205,196,0.25); }
    .btn-danger { background: rgba(255,95,95,0.12); color: var(--red); border: 1px solid rgba(255,95,95,0.25); }
    .btn-danger:hover { background: rgba(255,95,95,0.2); }
    .btn-ghost { background: rgba(255,255,255,0.05); color: var(--muted); border: 1px solid var(--border); }
    .btn-ghost:hover { background: rgba(255,255,255,0.1); color: var(--text); }
    .btn-full { width: 100%; justify-content: center; }
    .btn-sm { padding: 7px 14px; font-size: 0.8rem; }

    [hidden] { display: none !important; }

    #login-error { color: var(--red); font-size: 0.82rem; margin-top: 0.75rem; }

    /* ── DASHBOARD ── */
    #dashboard { min-height: 100vh; }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(2,5,14,0.92);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2rem;
    }

    .header-left { display: flex; align-items: center; gap: 1rem; }
    .header-logo { font-size: 1rem; font-weight: 700; }
    .header-logo span { color: var(--amber); }
    .header-badge { font-size: 0.7rem; background: rgba(78,205,196,0.1); border: 1px solid rgba(78,205,196,0.2); color: var(--teal); padding: 3px 10px; border-radius: 20px; }

    .dashboard-body {
      display: grid;
      grid-template-columns: 320px 1fr;
      min-height: calc(100vh - 60px);
    }

    /* ── SIDEBAR ── */
    .sidebar {
      border-right: 1px solid var(--border);
      padding: 1.5rem;
      overflow-y: auto;
      background: var(--bg2);
    }

    .sidebar-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.25rem;
    }

    .sidebar-head h2 { font-size: 0.85rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }

    .status-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; }
    .status-dot.published { background: var(--green); }
    .status-dot.draft { background: var(--amber); }

    .empty-msg { color: var(--muted); font-size: 0.84rem; text-align: center; padding: 2rem 0; }

    /* ── EDITOR ── */
    .editor-pane {
      padding: 2rem;
      overflow-y: auto;
    }

    .editor-pane h2 { font-size: 1.2rem; font-weight: 700; margin-bottom: 1.75rem; }

    .editor-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem; }

    .form-group textarea {
      resize: vertical;
      min-height: 300px;
      font-family: 'Fira Code', monospace;
      font-size: 0.85rem;
      line-height: 1.7;
    }

    .toggle-row { display: flex; align-items: center; gap: 0.75rem; cursor: pointer; position: relative; }

    .toggle {
      width: 44px;
      height: 24px;
      border-radius: 12px;
      background: rgba(255,255,255,0.1);
      border: 1px solid var(--border);
      cursor: pointer;
      position: relative;
      transition: background 0.2s;
      flex-shrink: 0;
    }

    .toggle-input { position: absolute; opacity: 0; width: 1px; height: 1px; }
    .toggle-input:checked + .toggle { background: var(--teal); border-color: var(--teal); }
    .toggle-input:focus-visible + .toggle { outline: 2px solid var(--teal); outline-offset: 2px; }

    .toggle::after {
      content: '';
      position: absolute;
      top: 3px; left: 3px;
      width: 16px; height: 16px;
      border-radius: 50%;
      background: white;
      transition: transform 0.2s;
    }

    .toggle-input:checked + .toggle::after { transform: translateX(20px); }

    .toggle-label { font-size: 0.875rem; font-weight: 500; }
    .toggle-label small { display: block; color: var(--muted); font-size: 0.77rem; font-weight: 400; }

    .editor-actions { display: flex; gap: 0.75rem; flex-wrap: wrap; }

    .toast {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.85rem 1.25rem;
      font-size: 0.875rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 999;
      transform: translateY(20px);
      opacity: 0;
      transition: all 0.3s;
      pointer-events: none;
    }

    .toast.show { transform: translateY(0); opacity: 1; }
    .toast.success { border-color: rgba(78,201,78,0.3); color: var(--green); }
    .toast.error { border-color: rgba(255,95,95,0.3); color: var(--red); }

    .helper-text { font-size: 0.78rem; color: var(--muted); margin-top: 0.35rem; }


    /* ── HEADER / TABS ── */
    .header-actions { display: flex; gap: 0.75rem; align-items: center; }
    .tabs { display: flex; gap: 0.25rem; }
    .tab-btn { background: none; border: 1px solid transparent; color: var(--muted); padding: 6px 14px; border-radius: 8px; font: inherit; font-size: 0.85rem; font-weight: 600; cursor: pointer; }
    .tab-btn:hover { color: var(--text); }
    .tab-btn.active { color: var(--teal); border-color: rgba(78,205,196,0.3); background: rgba(78,205,196,0.06); }
    .tab-btn:focus-visible, .btn:focus-visible, .item-main:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }

    /* ── ITEM LIST ── */
    .item-list { list-style: none; display: flex; flex-direction: column; gap: 0.6rem; }
    .item { display: flex; align-items: center; gap: 0.5rem; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 0.6rem 0.6rem 0.6rem 0.4rem; transition: border-color 0.2s; }
    .item:hover, .item.active { border-color: rgba(78,205,196,0.3); background: rgba(78,205,196,0.04); }
    .item.sortable-ghost { opacity: 0.4; }
    .drag-handle { cursor: grab; color: var(--muted); padding: 0 0.3rem; font-size: 1.1rem; user-select: none; }
    .item-main { flex: 1; min-width: 0; text-align: left; background: none; border: none; color: inherit; font: inherit; cursor: pointer; padding: 0; }
    .item-title { display: block; font-size: 0.88rem; font-weight: 600; line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .item-meta { display: flex; align-items: center; gap: 0.35rem; font-size: 0.74rem; color: var(--muted); margin-top: 0.2rem; }
    .btn-xs { padding: 5px 9px; font-size: 0.72rem; }

    /* ── EDITOR FORM ── */
    .editor-fields { display: grid; grid-template-columns: 1fr 1fr; column-gap: 1rem; }
    .editor-fields > .form-group { grid-column: 1 / -1; }
    .editor-fields > .form-group.half { grid-column: auto; }
    .toggle-group { margin-bottom: 1rem; }
    .req { color: var(--red); }
    .field-error { color: var(--red); font-size: 0.78rem; margin-top: 0.3rem; min-height: 0; }
    .field-error:empty { display: none; }
    [aria-invalid="true"] { border-color: rgba(255,95,95,0.6) !important; }

    @media (max-width: 800px) {
      .editor-fields { grid-template-columns: 1fr; }
      .editor-fields > .form-group.half { grid-column: 1 / -1; }
      header { flex-wrap: wrap; height: auto; padding: 0.75rem 1rem; gap: 0.5rem; }
      .dashboard-body { grid-template-columns: 1fr; }
      .sidebar { border-right: none; border-bottom: 1px solid var(--border); max-height: 280px; }
      .editor-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- LOGIN -->
  <div id="login-screen">
    <div class="login-box">
      <div class="login-logo" aria-hidden="true">🔐</div>
      <h1>Admin</h1>
      <p>Enter the admin password to manage your portfolio.</p>
      <div class="form-group">
        <label for="passInput">Password</label>
        <input type="password" id="passInput" placeholder="Enter password…" autocomplete="current-password" />
      </div>
      <button class="btn btn-primary btn-full" id="loginBtn" type="button"><i class="fas fa-unlock" aria-hidden="true"></i> Sign In</button>
      <div id="login-error" role="alert" hidden></div>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboard" hidden>
    <header>
      <div class="header-left">
        <span class="header-logo">Anukool<span>.</span></span>
        <nav class="tabs" role="tablist" aria-label="Content type">
          <button class="tab-btn active" type="button" role="tab" aria-selected="true" data-tab="projects">Projects</button>
          <button class="tab-btn" type="button" role="tab" aria-selected="false" data-tab="experience">Experience</button>
        </nav>
      </div>
      <div class="header-actions">
        <a href="/" class="btn btn-ghost btn-sm" target="_blank" rel="noopener"><i class="fas fa-globe" aria-hidden="true"></i> View Site</a>
        <button class="btn btn-ghost btn-sm" id="logoutBtn" type="button"><i class="fas fa-sign-out-alt" aria-hidden="true"></i> Logout</button>
      </div>
    </header>

    <div class="dashboard-body">
      <aside class="sidebar">
        <div class="sidebar-head">
          <h2 id="list-title">Projects</h2>
          <button class="btn btn-primary btn-sm" id="newBtn" type="button"><i class="fas fa-plus" aria-hidden="true"></i> New</button>
        </div>
        <ul class="item-list" id="itemList" aria-labelledby="list-title"></ul>
        <p class="helper-text">Drag ⠿ to reorder. Order is saved immediately.</p>
      </aside>

      <main class="editor-pane">
        <h2 id="editor-title">New project</h2>
        <form id="editorForm" novalidate>
          <div class="editor-fields" id="editorFields"></div>
          <div class="editor-actions">
            <button class="btn btn-primary" id="saveBtn" type="submit"><i class="fas fa-save" aria-hidden="true"></i> <span id="saveLabel">Create project</span></button>
            <button class="btn btn-danger" id="deleteBtn" type="button" hidden><i class="fas fa-trash" aria-hidden="true"></i> Delete</button>
            <button class="btn btn-ghost" id="clearBtn" type="button"><i class="fas fa-undo" aria-hidden="true"></i> Reset form</button>
          </div>
        </form>
      </main>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- SortableJS 1.15.7 — SRI hash computed from the downloaded file and matched against cdnjs -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.7/Sortable.min.js"
          integrity="sha512-ri8dokds012Oxz+iFzMs4KNJXVc+h7J1zq6unM1NTtzBLj4jD1R5BWiK6QycK0TdSdkt7zYcIcv6sUPhmYkbdQ=="
          crossorigin="anonymous" referrerpolicy="no-referrer" defer></script>
  <script src="/js/admin.js" defer></script>
</body>
</html>
